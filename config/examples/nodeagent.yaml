tlv_listener:
  address: "0.0.0.0"
  port: 9090

schedulers:
  # Local scheduling authority declarations. Each entry names a registered
  # NodeSchedulerFactory. task_type = sole authority over locally-originated
  # tasks of that type; local_default (at most one) = fallback authority;
  # neither = pure wire-protocol counterpart (no local submission authority).
  - extension:
      name: "push"
    task_type: "echo"
  - extension:
      name: "push"
    local_default: true
  - extension:
      name: "probe"
      typed_config:
        "@type": "type.googleapis.com/strij.extensions.schedulers.probe.ProbeSchedulerConfig"

pools:
  - name: "cpu"
    total: 16
  - name: "gpu.h100"
    total: 2

reservations:
  - task_type: "video-encode"
    pool: "gpu.h100"
    amount: 1

task_handlers:
  - name: "echo"
    typed_config:
      "@type": "type.googleapis.com/strij.extensions.task_handlers.echo.EchoTaskHandlerConfig"
      capacity:
        concurrency: 1024

  - name: "piped_executable"
    typed_config:
      "@type": "type.googleapis.com/strij.extensions.task_handlers.piped_executable.PipedExecutableTaskHandlerConfig"

heartbeat_interval:
  seconds: 5

logging:
  level: "debug"
  format: "text"
  output: "stdout"
  include_source_location: false