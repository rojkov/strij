# Kubernetes ConfigMap example for Strij Gateway
apiVersion: v1
kind: ConfigMap
metadata:
  name: strij-gateway-config
  namespace: strij
data:
  gateway.yaml: |
    http_listener:
      address: "0.0.0.0"
      port: 8081

    node_connections:
      - address: "nodeagent-0.strij.svc.cluster.local:9090"

    logging:
      level: "info"
      format: "json"
      output: "stdout"
---
# Kubernetes ConfigMap example for Strij NodeAgent
apiVersion: v1
kind: ConfigMap
metadata:
  name: strij-nodeagent-config
  namespace: strij
data:
  nodeagent.yaml: |
    tlv_listener:
      address: "0.0.0.0"
      port: 9090

    logging:
      level: "debug"
      format: "json"
      output: "stdout"
---
# Usage in a Pod spec:
