# Sample NodeAgent config #1 exercising the "probe" scheduler.
# Listens on port 9090; pair with gateway-probe.yaml and
# nodeagent-probe-9091.yaml.
tlv_listener:
  address: "0.0.0.0"
  port: 9090

schedulers:
  - name: "probe"
    typed_config:
      "@type": "type.googleapis.com/strij.extensions.schedulers.probe.ProbeSchedulerConfig"
      queue_capacity: 64
      max_concurrent_preallocations: 4

pools:
  - name: "cpu"
    total: 16

reservations:
  - task_type: "echo"
    pool: "cpu"
    amount: 1

task_handlers:
  - name: "echo"
    typed_config:
      "@type": "type.googleapis.com/strij.extensions.task_handlers.echo.EchoTaskHandlerConfig"
      capacity:
        concurrency: 1024

heartbeat_interval:
  seconds: 5

logging:
  level: "debug"
  format: "text"
  output: "stdout"
  include_source_location: false
