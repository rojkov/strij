syntax = "proto3";

package strij.task;

message Task {
  string id = 1;
  string type = 2;
  bytes body = 3;
  map<string, string> parameters = 4;
}

message TaskResult {
  string id = 1;
  bytes body = 2;
  // Absence means final. proto3 forbids explicit defaults on optional
  // fields, so consumers must treat `!has_is_final() || is_final()` as
  // final; producers of single-shot results may leave it unset.
  optional bool is_final = 3;
}
