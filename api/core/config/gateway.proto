syntax = "proto3";

package strij.config;

import "core/config/extensions.proto";
import "core/config/options.proto";

message GatewayConfig {
  HttpListener http_listener = 1;
  repeated NodeConnection node_connections = 2;
  Logging logging = 3;
  ExtensionConfig node_discovery = 4;
  // Required (at least one): the scheduling policies this gateway routes with.
  // The gateway fails to start when unset or when a name is not registered.
  repeated SchedulerConfig schedulers = 5 [(strij.config.required) = true];
}

// One configured scheduler instance. `task_type` binds the scheduler to a
// specific task type; an empty `task_type` marks it as the default scheduler
// used for any type without an explicit entry. The gateway fails to start on
// duplicate task_type bindings (or duplicate defaults) so routing stays
// unambiguous.
message SchedulerConfig {
  ExtensionConfig extension = 1;
  string task_type = 2;
}

message HttpListener {
  string address = 1;
  uint32 port = 2 [(strij.config.required) = true,
                   (strij.config.range_min) = "1",
                   (strij.config.range_max) = "65535"];
  // RESERVED for future (v2+)
  // uint32 max_connections = 3;
  // bool reuse_port = 4;
}

message NodeConnection {
  string address = 1 [(strij.config.required) = true,
                      (strij.config.pattern) = "^[^:]+:\\d+$"];
  // RESERVED for future (v2+): NodeDirectory doesn't use these yet
  // uint32 connect_timeout_ms = 2;
  // uint32 max_reconnect_attempts = 3;
  // uint32 reconnect_backoff_ms = 4;
}
