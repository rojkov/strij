syntax = "proto3";

package strij.config;

import "common/config/extensions.proto";
import "common/config/options.proto";
import "common/node/capabilities.proto";
import "google/protobuf/duration.proto";

message NodeAgentConfig {
  TlvListener tlv_listener = 1;
  Logging logging = 2;
  repeated strij.node.ResourcePool pools = 7;
  repeated strij.node.PoolReservation reservations = 8;
  google.protobuf.Duration heartbeat_interval = 10;
  repeated ExtensionConfig task_handlers = 6;
  repeated ExtensionConfig schedulers = 9 [(strij.config.required) = true];
  // Opt-in data dependency prefetching. Each entry is a standard
  // ExtensionConfig naming a DataDependencyFetcherFactory (e.g. "ray",
  // "http"); the union of their HandledSourceTypes() must be disjoint.
  // Empty = no prefetching: Task.deps / TaskProbe.deps are silently ignored.
  repeated ExtensionConfig data_dependency_fetchers = 12;
  ObjectCacheConfig object_cache = 13;
  // RESERVED for future (v2+)
  // google.protobuf.Duration connection_timeout = 3;
  // google.protobuf.Duration heartbeat_interval = 4; // active in v2, see above
  // TlsConfig tls = 5;
}

// Node-global object cache knobs. Eviction is a fetcher concern; validation of
// these knobs and the concrete cache implementation remain future work.
message ObjectCacheConfig {
  // LRU eviction when the entry count exceeds this; 0 = unlimited.
  uint64 max_entries = 1;
  // Per-ref TTL; 0 = no expiry. Not yet enforced (interface does not expose
  // timestamps); reserved for a future eviction-aware implementation.
  google.protobuf.Duration default_ttl = 2;
}

message TlvListener {
  string address = 1;
  uint32 port = 2 [(strij.config.required) = true,
                   (strij.config.range_min) = "1",
                   (strij.config.range_max) = "65535"];
  // RESERVED for future (v2+)
  // uint32 max_connections = 3;
  // bool reuse_port = 4;
  // uint32 read_buffer_size = 5;
}
