[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strij"
version = "0.1.0"
description = "Python SDK and worker runtime for the Strij pyfunction task handler"
requires-python = ">=3.10"
dependencies = [
    # The Bazel worker vendors cloudpickle 3.1.1 in-tree; the client package
    # tracks the same version range.
    "cloudpickle>=3.1,<4",
    # Must match the runtime generated by the Bazel protobuf module (33.4).
    "protobuf==6.33.4",
]

[tool.setuptools]
packages = ["strij", "strij._proto"]
